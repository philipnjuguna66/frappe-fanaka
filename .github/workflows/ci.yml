name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-fanaka_app-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB & Configure Permissions
        run: |
          echo "Waiting for MariaDB..."
          until mariadb-admin ping -h "127.0.0.1" -P 3306 -u root -proot --silent; do
            sleep 2
          done
          # Ensure root has access via TCP for the bench commands
          mariadb -h 127.0.0.1 -u root -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';"
          mariadb -h 127.0.0.1 -u root -proot -e "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root';"
          mariadb -h 127.0.0.1 -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;"
          mariadb -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4';"
          mariadb -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
          mariadb -h 127.0.0.1 -u root -proot -e "FLUSH PRIVILEGES;"

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          # Explicitly tell bench to use the containerized DB
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://localhost:13000
          bench set-config -g redis_queue redis://localhost:11000

      - name: Install App & Build
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app fanaka_app $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin --db-host 127.0.0.1 test_site
          bench --site test_site install-app fanaka_app
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app fanaka_app
        env:
          TYPE: server